syntax = "proto3";
package raftpb;

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option go_package = "pkg/raft/raftpb";

message Message{
    enum Type { GET = 0; PUT=1; DELETE = 2; UPDATE_PARTITION_TABLE = 3;}
    Type type = 1;
    int32 key = 2;
    google.protobuf.Int32Value value = 3;
    string idempotency_token = 4;
    string client_id = 5;

    // Partition table update payload (only used when type = UPDATE_PARTITION_TABLE)
    PartitionTableUpdate partition_update = 6;
}

message Null {}

message GetRequest {
    int32 key = 1;
}

message GetResponse {
    int32 key = 1;
    int32 value = 2;
    bool found = 3;
}

message ForwardResponse {
    bool success = 1;
    int32 value = 2;
}

message LogEntry{
    int32 term = 1;
    Message message = 2;
}

message VoteRequestArgs{
    int32 candidateId = 1;
	int32 candidateTerm = 2;
	int32 candidateLogLength = 3;
	int32 candidateLogTerm = 4;
}

message VoteResponse{
    int32 nodeId = 1;
	int32 currentTerm = 2;
	bool granted = 3;
}

message LogRequestArgs{
    int32 leaderId = 1;
    int32 term = 2;
    int32 prefixLen = 3;
    int32 prefixTerm = 4;
    int32 commitLength = 5;
    repeated LogEntry suffix = 6;
}

message LogResponse{
    int32 nodeId = 1;
    int32 currentTerm = 2;
    int32 ack = 3;
    bool success = 4;
}


message InstallSnapshotRequest{
    int32 leaderTerm = 1;
    int32 leaderId = 2;
    int32 lastIncludedIndex = 3;
    int32 lastIncludedTerm = 4;
    int32 offset = 5;
    bytes data = 6;
    bool done = 7;
}

message InstallSnapshotResponse{
    int32 term = 1;
}

// Partition table update message
message PartitionTableUpdate {
    // Map of partition_id -> node_id
    // Uses repeated for protobuf compatibility
    repeated PartitionAssignment assignments = 1;
    uint64 version = 2;
}

message PartitionAssignment {
    uint32 partition_id = 1;
    int32 node_id = 2;
}

// Replication messages (primary → backup synchronous replication)
message ReplicateRequest {
    int32 key = 1;
    int32 value = 2;           // Only for PUT operations
    string operation = 3;      // "PUT" or "DELETE"
    uint64 version = 4;        // For future ordering/deduplication
}

message ReplicateResponse {
    bool success = 1;
    string error = 2;          // Error message if success = false
}

// Worker registration messages (Stage 2)
message RegisterWorkerRequest {
    int32 worker_id = 1;
    string grpc_addr = 2;      // Worker's gRPC address for replication
    string http_addr = 3;      // Worker's HTTP API address
}

message RegisterWorkerResponse {
    bool success = 1;
    string error = 2;
    PartitionTable partition_table = 3;  // Current partition table
    uint64 partition_table_version = 4;
}

// Worker heartbeat messages
message WorkerHeartbeatRequest {
    int32 worker_id = 1;
    int64 timestamp = 2;
}

message WorkerHeartbeatResponse {
    bool success = 1;
    uint64 partition_table_version = 2;  // Current partition table version
}

// Partition table update (Raft → Worker)
message UpdatePartitionTableRequest {
    PartitionTable partition_table = 1;
    uint64 version = 2;
}

message UpdatePartitionTableResponse {
    bool success = 1;
}

// Complete partition table structure
message PartitionTable {
    repeated PartitionAssignment assignments = 1;
    uint64 version = 2;
}


service Raft{
    rpc Forward (Message) returns (ForwardResponse);
    rpc ForwardGet (GetRequest) returns (GetResponse);
    rpc VoteRequest (VoteRequestArgs) returns (VoteResponse);
    rpc LogRequest(LogRequestArgs) returns (LogResponse);
    rpc Heartbeat (google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
    rpc Replicate(ReplicateRequest) returns (ReplicateResponse);  // Primary-backup replication

    // Worker registration and heartbeat (Stage 2)
    rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
    rpc WorkerHeartbeat(WorkerHeartbeatRequest) returns (WorkerHeartbeatResponse);
    rpc UpdatePartitionTable(UpdatePartitionTableRequest) returns (UpdatePartitionTableResponse);
}



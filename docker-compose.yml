version: '3.8'

services:
  raft-node-0:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: raft-node-0
    environment:
      # Raft configuration
      RAFT_ID: "0"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "raft-node-0:9000,raft-node-1:9000,raft-node-2:9000"
      FILENAME: "/data/node0"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management (configurable)
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "1s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node0:/data
    networks:
      - raft-network
    ports:
      - "9000:9000"
      - "8080:8080"
    restart: unless-stopped

  raft-node-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: raft-node-1
    environment:
      # Raft configuration
      RAFT_ID: "1"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "raft-node-0:9000,raft-node-1:9000,raft-node-2:9000"
      FILENAME: "/data/node1"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node1:/data
    networks:
      - raft-network
    ports:
      - "9001:9000"
      - "8081:8080"
    restart: unless-stopped

  raft-node-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: raft-node-2
    environment:
      # Raft configuration
      RAFT_ID: "2"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "raft-node-0:9000,raft-node-1:9000,raft-node-2:9000"
      FILENAME: "/data/node2"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node2:/data
    networks:
      - raft-network
    ports:
      - "9002:9000"
      - "8082:8080"
    restart: unless-stopped

networks:
  raft-network:
    driver: bridge
    name: raft-cluster

volumes:
  node0-data:
  node1-data:
  node2-data:

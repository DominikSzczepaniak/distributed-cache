version: '3.8'

services:
  controller-0:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: controller-0
    environment:
      # Raft configuration
      RAFT_ID: "0"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "controller-0:9000,controller-1:9000,controller-2:9000"
      FILENAME: "/data/node0"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management (configurable)
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "1s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node0:/data
    networks:
      - raft-network
    ports:
      - "9000:9000"
      - "8080:8080"
    restart: unless-stopped

  controller-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: controller-1
    environment:
      # Raft configuration
      RAFT_ID: "1"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "controller-0:9000,controller-1:9000,controller-2:9000"
      FILENAME: "/data/node1"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node1:/data
    networks:
      - raft-network
    ports:
      - "9001:9000"
      - "8081:8080"
    restart: unless-stopped

  controller-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: controller-2
    environment:
      # Raft configuration
      RAFT_ID: "2"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "controller-0:9000,controller-1:9000,controller-2:9000"
      FILENAME: "/data/node2"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node2:/data
    networks:
      - raft-network
    ports:
      - "9002:9000"
      - "8082:8080"
    restart: unless-stopped

  datanode-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-1
    environment:
      - CONTROLLER_URL=http://controller-0:8080
      - NODE_ID=datanode-1:9000
      - LEASE_DURATION=5s
    depends_on:
      - controller-0
    networks:
      - raft-network
      - client-network
    ports:
      - "9010:9000"
    restart: unless-stopped

  datanode-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-2
    environment:
      - CONTROLLER_URL=http://controller-0:8080
      - NODE_ID=datanode-2:9000
      - LEASE_DURATION=5s
    depends_on:
      - controller-0
    networks:
      - raft-network
      - client-network
    ports:
      - "9011:9000"
    restart: unless-stopped

  datanode-3:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-3
    environment:
      - CONTROLLER_URL=http://controller-0:8080
      - NODE_ID=datanode-3:9000
      - LEASE_DURATION=5s
    depends_on:
      - controller-0
    networks:
      - raft-network
      - client-network
    ports:
      - "9012:9000"
    restart: unless-stopped

  datanode-4:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-4
    environment:
      - CONTROLLER_URL=http://controller-0:8080
      - NODE_ID=datanode-4:9000
      - LEASE_DURATION=5s
    depends_on:
      - controller-0
    networks:
      - raft-network
      - client-network
    ports:
      - "9013:9000"
    restart: unless-stopped

  datanode-5:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-5
    environment:
      - CONTROLLER_URL=http://controller-0:8080
      - NODE_ID=datanode-5:9000
      - LEASE_DURATION=5s
    depends_on:
      - controller-0
    networks:
      - raft-network
      - client-network
    ports:
      - "9014:9000"
    restart: unless-stopped

networks:
  raft-network:
    driver: bridge
    name: raft-cluster
  client-network:
    driver: bridge
    name: client-access

volumes:
  node0-data:
  node1-data:
  node2-data:

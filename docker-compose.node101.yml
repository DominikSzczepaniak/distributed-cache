# Docker Compose for Computer 192.168.1.101
# Components: Controller 1, Controller 2, DataNode 3, DataNode 4
#
# IMPORTANT: This setup requires the controller to derive its listen port from RAFT_ADDRS.
# Controller 1 listens on port 9000, Controller 2 on port 9001 based on their RAFT_ID.
#
# Usage:
#   docker-compose -f docker-compose.node101.yml up --build
#
# Before running, ensure the other computer (192.168.1.100) is also starting its containers.

version: '3.8'

services:
  controller-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: controller-1
    hostname: controller-1
    environment:
      # Raft configuration
      RAFT_ID: "1"
      TOTAL_NODES: "3"
      # Controller 0 on 192.168.1.100, Controllers 1 & 2 on this machine
      RAFT_ADDRS: "192.168.1.100:9000,192.168.1.101:9000,192.168.1.101:9001"
      FILENAME: "/data/node1"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration - port 8080
      API_ADDR: ":8080"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node1:/data
    network_mode: host
    restart: unless-stopped

  controller-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: controller-2
    hostname: controller-2
    environment:
      # Raft configuration
      RAFT_ID: "2"
      TOTAL_NODES: "3"
      RAFT_ADDRS: "192.168.1.100:9000,192.168.1.101:9000,192.168.1.101:9001"
      FILENAME: "/data/node2"
      SNAPSHOT_THRESHOLD: "100"

      # Connection management
      RAFT_INITIAL_BACKOFF: "1s"
      RAFT_MAX_BACKOFF: "30s"
      RAFT_BACKOFF_MULTIPLIER: "2.0"
      RAFT_MAX_RETRIES: "-1"
      RAFT_CONN_TIMEOUT: "5s"
      RAFT_HEALTH_CHECK_INTERVAL: "10s"

      # HTTP API configuration - port 8081 (different from controller-1)
      API_ADDR: ":8081"

      # Retry configuration
      API_RETRY_MAX_ATTEMPTS: "3"
      API_RETRY_INITIAL_DELAY: "100ms"
      API_RETRY_MAX_DELAY: "5s"
      API_IDEMPOTENCY_TTL: "5m"
    volumes:
      - ./data/node2:/data
    network_mode: host
    restart: unless-stopped

  datanode-3:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-3
    hostname: datanode-3
    environment:
      - CONTROLLER_URL=http://192.168.1.101:8080
      - NODE_ID=192.168.1.101:9010
      - LEASE_DURATION=5s
    depends_on:
      - controller-1
    network_mode: host
    restart: unless-stopped

  datanode-4:
    build:
      context: .
      dockerfile: deploy/Dockerfile.datanode
    container_name: datanode-4
    hostname: datanode-4
    environment:
      - CONTROLLER_URL=http://192.168.1.101:8080
      - NODE_ID=192.168.1.101:9011
      - LEASE_DURATION=5s
    depends_on:
      - controller-1
    network_mode: host
    restart: unless-stopped
